{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}مدیریت LCD{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'LCD/css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <nav class="nav-shell" aria-label="ناوبری اصلی">
            <a class="brand-mark" href="{% url 'LCD:lcd_list' %}">
                <span class="brand-icon" id="navSharingan">
                    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
                        <defs>
                            <radialGradient id="irisN" cx="50%" cy="50%" r="50%">
                                <stop offset="0%" stop-color="#cc0000"/>
                                <stop offset="55%" stop-color="#8b0000"/>
                                <stop offset="100%" stop-color="#1a0000"/>
                            </radialGradient>
                            <g id="tomoe">
                                <circle cx="28" cy="50" r="6.7" fill="#080000"/>
                                <path d="M 28,56.7 27.8,51.0 C 22.6,51.0 17.6,51.4 14.3,44.4 C 15.5,52.0 18.9,56.7 28,56.7 z" fill="#080000"/>
                            </g>
                            <path id="blade-full" d="M 59.2,3.6 C 45.0,22.8 51.8,33.6 59.9,39.5 C 87.0,53.5 91.6,71.5 85.3,81.6 C 79.1,64.0 66.0,57.5 52.8,65.0 C 29.0,79.5 13.6,77.1 5.2,65.5 C 19.4,67.7 36.4,64.5 36.0,42.8 C 36.5,32.5 37.2,5.5 59.2,3.6 z" fill="#080000" stroke="#cc0000" stroke-width="1.2"/>
                        </defs>
                        <circle cx="50" cy="50" r="44" fill="none" stroke="#2a0a0a" stroke-width="1.5"/>
                        <circle cx="50" cy="50" r="42" fill="#080000"/>
                        <circle cx="50" cy="50" r="35" fill="url(#irisN)"/>

                        <g class="idle-layer">
                            <circle class="tomoe-ring" cx="50" cy="50" r="22" fill="none" stroke="#000" stroke-width="1.2" opacity="0.3"/>
                            <g class="nav-spin">
                                <use href="#tomoe" transform="rotate(0 50 50)"/>
                                <use href="#tomoe" transform="rotate(120 50 50)"/>
                                <use href="#tomoe" transform="rotate(240 50 50)"/>
                            </g>
                        </g>

                        <g class="mangekyo-layer">
                            <g class="nav-spin-full">
                                <use href="#blade-full"/>
                                <circle class="center-hub" cx="50" cy="50" r="6" fill="#080000" stroke="#cc0000" stroke-width="1.2"/>
                            </g>
                        </g>

                        <circle cx="50" cy="50" r="7" fill="#000005"/>
                        <circle class="nav-glow" cx="50" cy="50" r="35" fill="none" stroke="#ff0000" stroke-width="2" opacity="0"/>
                    </svg>
                </span>
                <span>
                    <strong>دایی ایمان</strong>
                    <small>انبار</small>
                </span>
            </a>

            <div class="nav-links">
                <a href="{% url 'LCD:lcd_list' %}">خانه</a>
                <a href="{% url 'LCD:lcd_create' %}">LCD جدید</a>
                <a href="{% url 'LCD:brand_list' %}">برندها</a>
                <a href="{% url 'LCD:brand_create' %}">برند جدید</a>
            </div>
        </nav>
    </header>

    <main class="page-shell">
        {% if messages %}
            <section class="messages" aria-label="پیام‌ها">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>
                {% endfor %}
            </section>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

<script>
    (function () {
        var brandIcon = document.querySelector('.brand-icon');
        if (brandIcon) {
            brandIcon.addEventListener('mouseenter', function () {
                document.body.classList.add('sharingan-active');
                document.dispatchEvent(new CustomEvent('sharingan:activate'));
            });
            brandIcon.addEventListener('mouseleave', function () {
                document.body.classList.remove('sharingan-active');
                document.dispatchEvent(new CustomEvent('sharingan:deactivate'));
            });
        }
    }());
</script>
</body>
</html>
